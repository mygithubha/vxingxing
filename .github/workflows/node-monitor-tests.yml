name: Node monitor collector tests

on:
  push:
    branches: [feature/simple-auto-connect-ui]
    paths:
      - "tools/node-monitor/**"
      - ".github/workflows/node-monitor-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector unit tests
        working-directory: tools/node-monitor
        run: python -m unittest discover -s tests -v
