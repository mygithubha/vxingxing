name: Auto Connect Android Build

on:
  workflow_dispatch:
  push:
    branches: [upstream-import, feature/simple-auto-connect-ui, feature/auto-connect-stability-release, feature/remember-last-node]
    paths:
      - "app/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "repositories.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "buildScript/**"
      - "nb4a.properties"
      - ".github/actions/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: auto-connect-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ThroneCore AAR and schema
        uses: ./.github/actions/throne-core

      - name: Fetch route profiles
        uses: ./.github/actions/routeprofiles

      - name: Fetch sing-box dashboard
        uses: ./.github/actions/sing-box-dashboard

      - name: Set up Java 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper/dists
          cache-read-only: false

      - name: Build OSS debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace app:assembleOssDebug

      - name: Run OSS debug unit tests
        run: ./gradlew --no-daemon app:testOssDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-connect-oss-debug-${{ github.sha }}
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error

      - name: Check release signing configuration
        id: release-signing
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        shell: bash
        run: |
          if [[ -n "$SIGNING_KEYSTORE_B64" && -n "$SIGNING_STORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Signed OSS Release build enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Signed OSS Release not built"
              echo
              echo "Configure repository Actions secrets: SIGNING_KEYSTORE_B64, SIGNING_STORE_PASSWORD, and SIGNING_KEY_ALIAS. SIGNING_KEY_PASSWORD is optional and defaults to the store password."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build signed OSS release APK
        if: steps.release-signing.outputs.configured == 'true'
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          UPDATE_SIGNER_SHA256: ${{ secrets.UPDATE_SIGNER_SHA256 }}
        run: ./gradlew --no-daemon --stacktrace app:assembleOssRelease

      - name: Run OSS release unit tests
        if: steps.release-signing.outputs.configured == 'true'
        run: ./gradlew --no-daemon app:testOssReleaseUnitTest

      - name: Upload signed OSS release APK
        if: steps.release-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auto-connect-oss-release-${{ github.sha }}
          path: app/build/outputs/apk/oss/release/*.apk
          if-no-files-found: error
