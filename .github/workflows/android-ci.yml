name: Auto Connect Android Build

on:
  workflow_dispatch:
  push:
    branches: [upstream-import, 'test/apk-*']
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "buildScript/**"
      - "nb4a.properties"
      - ".github/actions/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: auto-connect-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ThroneCore AAR and schema
        uses: ./.github/actions/throne-core

      - name: Fetch route profiles
        uses: ./.github/actions/routeprofiles

      - name: Fetch sing-box dashboard
        uses: ./.github/actions/sing-box-dashboard

      - name: Set up Java 17 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Build OSS debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace app:assembleOssDebug

      - name: Run OSS debug unit tests
        run: ./gradlew --no-daemon app:testOssDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-connect-oss-debug-${{ github.sha }}
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
